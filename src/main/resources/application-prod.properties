spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.security.user.name=${SECURITYUSERNAME}
spring.security.user.password=${SECURITYPASSWORD}

#Copy these into application-test.properties for testing, remove before commiting
#Token.value is redundant since we are not using S3 Sessions

Token.value=${TOKENVALUE}

Access.Key.ID=${ACCESSKEYID}

Secret.Access.Key=${SECRETACCESSKEY}

server.port=${PORT:8081}

Thumbnail.Bucket.Name=note-share-utp-thumbnails

First.Bucket.Name=first-storage

kafka.topic=${KAFKATOPIC}

kafka.filescan.topic=${KAFKAFILESCANTOPIC}

kafka.port=${KAFKAPORT}

spring.kafka.bootstrap-servers=localhost:9092

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# This tells Tomcat to continue reading the file even if it's too big
# so it can actually reach your ExceptionHandler.
# so if a file exceeds 20MB, tomcat will still continue reading the file, allowing us to detect and show an error message
# if the file exceeds the tomcat max swallow size, tomcat will cut the connection immediately, and we will not get to see the error page
server.tomcat.max-swallow-size=1000MB

spring.jpa.show-sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace
