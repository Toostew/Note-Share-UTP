<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>UTP Note Share</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-gray-200">
<header class="h-20 bg-sky-800 border-b flex items-center px-6">

    <div class="items-center flex-column">
        <h1 class=" font-sans text-2xl tracking-tighter text-left text-white">UTP Note Share</h1>
        <div class="flex gap-0.5">
            <h1 class=" font-sans text-xs tracking-tighter text-white">Project by</h1>
            <a class=" font-sans text-xs tracking-tighter text-white hover:text-sky-400" href="https://github.com/Toostew" target="_blank">Toostew</a>
        </div>
    </div>


</header>

<div class="flex min-h-screen overflow-hidden">
    <aside class="w-40 bg-white border-r min-h-screen p-1 flex flex-col gap-0.5">
        <a class="w-full h-20 border p-2 hover:bg-gray-200 transition font-mono text-lg" th:href="@{/}">
            <p>Main Menu</p>
        </a>
        <a class="w-full h-20 border p-2 hover:bg-gray-200 transition font-mono text-lg" th:href="@{/view-categories}">
            <p>View</p>
        </a>
        <a class="w-full h-20 border p-2 hover:bg-gray-200 transition font-mono text-lg" th:href="@{/upload}">
            <p>Upload</p>
        </a>
        <a class="w-full h-20 border p-2 hover:bg-gray-200 transition font-mono text-lg" th:href="@{/statistics}">
            <p>Statistics</p>
        </a>
    </aside>


    <main class="flex-1 p-4 space-y-4 max-w-full min-w-3xl overflow-y-visible">
        <h1 class="text-3xl font-mono tracking-tight">
            Courses
        </h1>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <div class=" bg-white rounded-md shadow-md border h-128 hover:bg-gray-200 hover:opacity-90 transition" th:each="course : ${courses}">
                <a th:href="@{/view-category/{courseId}(courseId=${course.id})}">
                    <div class="flex-1 flex p-1 h-96 overflow-hidden">
                        <img th:src="@{/thumbnail/{category}(category=${course.category})}" class="object-cover w-full h-full">
                    </div>
                    <div class="w-full h-full p-2 gap-1 overflow-hidden">
                        <p class="text-base" th:text="${course.name}"></p>
                    </div>
                </a>

            </div>
        </div>





    </main>
</div>
</body>
</html>
