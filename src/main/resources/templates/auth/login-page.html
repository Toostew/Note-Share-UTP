<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>UTP Note Share</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-gray-200">
<!--This is technically not needed anymore since by default browsers will request for favicon.ico,
spring will look for it in resources/static-->
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link href="./output.css" rel="stylesheet">
<header class="h-20 bg-sky-800 border-b flex items-center px-6">

    <div class="items-center flex-column">
        <h1 class=" font-sans text-2xl tracking-tighter text-left text-white">UTP Note Share</h1>
        <div class="flex gap-0.5">
            <h1 class=" font-sans text-xs tracking-tighter text-white">Project by</h1>
            <a class=" font-sans text-xs tracking-tighter text-white hover:text-sky-400" href="https://github.com/Toostew" target="_blank">Toostew</a>
        </div>
    </div>

    <div class="font-sans text-2xl tracking-tighter text-left text-white" sec:authorize="isAuthenticated()">
        logged in as: <span sec:authentication="principal.username"></span>
    </div>

</header>

<div class="flex">
    <aside class="w-40 bg-white border-r min-h-screen p-1 flex flex-col gap-0.5">
        <a class="w-full h-20 border p-2 hover:bg-gray-200 transition font-mono text-lg" th:href="@{/main-menu}">
            <p>Main Menu</p>
        </a>
        <a class="w-full h-20 border p-2 hover:bg-gray-200 transition font-mono text-lg" th:href="@{/view-categories}">
            <p>View</p>
        </a>
        <a class="w-full h-20 border p-2 hover:bg-gray-200 transition font-mono text-lg" th:href="@{/upload}">
            <p>Upload</p>
        </a>
        <a class="w-full h-20 border p-2 hover:bg-gray-200 transition font-mono text-lg" th:href="@{/statistics}">
            <p>Statistics</p>
        </a>
    </aside>


    <main class="flex-1 p-4 space-y-4 max-w-4xl w-full">
        <h1 class="text-3xl font-mono tracking-tight">
            Login
        </h1>

        <div class="flex flex-col max-w-4xl mt-10 p-6 bg-white rounded-2xl shadow-md space-y-4">

            <form th:action="@{/authenticate-user}" method="post" class="max-w-full space-y-4">
                <input class="block w-full text-lg rounded-md bg-gray-200 text-gray-700 p-2" type="text" id="username" name="username" placeholder="Username">
                <input class="block w-full text-lg rounded-md bg-gray-200 text-gray-700 p-2" type="password" id="password" name="password" placeholder="Password">

                <div class="flex flex-row gap-4">
                    <button type="submit" class="flex-1 py-2 px-4 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">
                        Login
                    </button>
                </div>
            </form>

            <div sec:authorize="isAuthenticated()" class="w-full">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="w-full py-2 px-4 bg-gray-600 text-white rounded-md hover:bg-gray-700 transition">
                        Logout
                    </button>
                </form>
            </div>

            <div th:if="${param.logout}">
                <p class="text-green-500 font-bold">You have been logged out!</p>
            </div>
            <div th:if="${param.error}">
                <p class="text-red-500 font-bold">Invalid username or password.</p>
            </div>
        </div>



    </main>
</div>
</body>
</html>
